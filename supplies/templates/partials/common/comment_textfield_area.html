<div class="order-detail-comment">
    {% if order.comment %}
    <div class="order-detail-comment-view">
        <div class="order-detail-comment-body">
            <i class="bi bi-chat-left-text text-muted"></i>
            <span class="order-detail-comment-text comment-pre-wrap" title="{{ order.comment }}">{{ order.comment }}</span>
        </div>
        <button type="button" class="btn btn-sm btn-outline-secondary order-detail-comment-btn" role="button"
                hx-post="{% url 'orderDetail_add_comment' %}"
                hx-vals='{"order_id": "{{ order.id }}"}'
                hx-target="#comment_input_textfield_area"
                title="Редагувати коментар">
            <i class="bi bi-pencil"></i>
        </button>
    </div>
    {% else %}
    <button type="button" class="btn btn-sm btn-outline-secondary order-detail-comment-add" role="button"
            hx-post="{% url 'orderDetail_add_comment' %}"
            hx-vals='{"order_id": "{{ order.id }}"}'
            hx-target="#comment_input_textfield_area">
        <i class="bi bi-plus-lg"></i> Коментар
    </button>
    {% endif %}
</div>
