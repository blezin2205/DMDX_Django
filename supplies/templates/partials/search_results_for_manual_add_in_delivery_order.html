{% if results %}
  <ul class="list-group list-group-flush delivery-search-results-list mb-0">
    {% for item in results %}
      <li class="list-group-item list-group-item-action p-0 border-0 border-bottom">
        <button type="button"
          class="delivery-staging-pick-link btn btn-link text-start text-dark text-decoration-none w-100 p-2 rounded-0"
          data-gen-sup-id="{{ item.id }}"
          data-delivery-order-id="{{ delivery_order_id }}"
          data-pick-url="{% url 'add_gen_sup_in_delivery_order_manual_list' %}">
          <div class="fw-medium small mb-1">{{ item.name }}</div>
          <div class="d-flex flex-wrap gap-2 text-muted" style="font-size:0.72rem">
            {% if item.ref %}<span><i class="bi bi-hash"></i>{{ item.ref }}</span>{% endif %}
            {% if item.SMN_code %}<span><i class="bi bi-upc"></i>{{ item.SMN_code }}</span>{% endif %}
            {% if item.category %}<span><i class="bi bi-tag"></i>{{ item.category.name }}</span>{% endif %}
            {% if item.package_and_tests %}<span><i class="bi bi-box"></i>{{ item.package_and_tests }}</span>{% endif %}
          </div>
        </button>
      </li>
    {% endfor %}
  </ul>
{% elif search_attempted %}
  <div class="p-2 text-muted small">Нічого не знайдено</div>
{% endif %}
