<div class="supply-row-dropdown home-table-display-dropdown">
    <button type="button"
            class="btn btn-sm home-table-display-menu-btn compact-menu-trigger"
            title="Налаштування таблиці"
            aria-expanded="false"
            aria-haspopup="true"
            aria-label="Налаштування таблиці">
        <i class="bi bi-gear"></i>
    </button>
    <div class="supply-row-actions-panel home-table-display-panel" role="menu" hidden>
        <div class="home-table-display-option" data-home-display-option="edit">
            <label class="home-table-display-option-label" for="homeDisplayEdit">Режим редагування</label>
            <div class="form-check form-switch mb-0">
                <input class="form-check-input" type="checkbox" role="switch" id="homeDisplayEdit" data-home-display="edit" checked>
            </div>
        </div>
        <div class="home-table-display-option" data-home-display-option="cart">
            <label class="home-table-display-option-label" for="homeDisplayCart">Кошик замовлення</label>
            <div class="form-check form-switch mb-0">
                <input class="form-check-input" type="checkbox" role="switch" id="homeDisplayCart" data-home-display="cart" checked>
            </div>
        </div>
        <div class="home-table-display-option" data-home-display-option="precart">
            <label class="home-table-display-option-label" for="homeDisplayPrecart">Кошик передзамовлення</label>
            <div class="form-check form-switch mb-0">
                <input class="form-check-input" type="checkbox" role="switch" id="homeDisplayPrecart" data-home-display="precart" checked>
            </div>
        </div>
        <div class="home-table-display-option" data-home-display-option="smn">
            <label class="home-table-display-option-label" for="homeDisplaySmn">Показати SMN</label>
            <div class="form-check form-switch mb-0">
                <input class="form-check-input" type="checkbox" role="switch" id="homeDisplaySmn" data-home-display="smn" checked>
            </div>
        </div>
    </div>
</div>
