<tr class="delivery-item-row delivery-item-row--edit">
  <td class="delivery-item-name" colspan="2">
    <div class="fw-medium">{{ item.name }}</div>
    <div class="delivery-item-meta">
      {% if item.ref %}<span>REF: {{ item.ref }}</span>{% endif %}
      {% if item.SMN_code %}<span>SMN: {{ item.SMN_code }}</span>{% endif %}
      {% if item.category %}<span>{{ item.category }}</span>{% endif %}
    </div>
  </td>
  <td>
    <input name="lot_input_field_{{ item.id }}" value="{{ del_sup.supplyLot }}" type="text"
      class="form-control form-control-sm" placeholder="LOT">
  </td>
  <td>
    <input name="expired_input_field_{{ item.id }}" value="{{ del_sup.expiredDate_desc }}" type="text"
      class="form-control form-control-sm delivery-date-mask" placeholder="РРРР-ММ-ДД" maxlength="10"
      data-delivery-date-mask>
  </td>
  <td>
    <input name="count_input_field_{{ item.id }}" value="{{ del_sup.count }}" type="number" min="0"
      class="form-control form-control-sm" style="max-width:5rem">
  </td>
  <td class="text-end text-nowrap">
    <button type="button" class="btn btn-sm btn-outline-danger"
      hx-post="{% url 'add_gen_sup_in_delivery_order_manual_list_delete_action' %}"
      hx-vals='{"del_sup_id": "{{ del_sup.id }}"}'
      hx-target="closest tr.delivery-item-row"
      hx-swap="delete">
      <i class="bi bi-trash3"></i>
    </button>
    <button type="button" class="btn btn-sm btn-primary"
      hx-post="{% url 'add_gen_sup_in_delivery_order_manual_list_save_action' %}"
      hx-vals='{"gen_sup_id": {{ item.id }}, "del_sup_id": {{ del_sup.id }}, "delivery_order_id": {{ delivery_order_id }}}'
      hx-include="closest tr"
      hx-target="closest tr.delivery-item-row"
      hx-swap="outerHTML">
      <i class="bi bi-check-lg"></i>
    </button>
  </td>
</tr>
