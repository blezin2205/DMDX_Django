version: '3.8'

services:
  db:
    image: postgres:17
    restart: always
    volumes:
      # Це збереже ваші дані БД, навіть якщо контейнер видалиться
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=dmdx
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=4646

  web:
    build: .
    restart: always
    command: >
      sh -c "python manage.py createcachetable &&
             python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn DMDX_Django.wsgi:application --bind 0.0.0.0:8000 --workers 5 --threads 2"
    ports:
      - "8000:8000"
    environment:
      - DJANGO_SETTINGS_MODULE=DMDX_Django.settings_docker
      - LIGHTWEIGHT_MODE=1
      - DEBUG=False
      # Локальний Docker по http://localhost — без HTTPS secure-cookies не працюють
      - INSECURE_COOKIES=True
      - DB_NAME=dmdx
      - DB_USER=postgres
      - DB_PASSWORD=4646
      - DB_HOST=db
      - DB_PORT=5432
    depends_on:
      - db

volumes:
  postgres_data: