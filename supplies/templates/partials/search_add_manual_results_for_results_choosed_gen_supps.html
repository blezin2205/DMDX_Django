<div class="delivery-staging-row">
  <div class="row g-2 align-items-end small">
    <div class="col-md-4">
      <div class="fw-medium">{{ item.name }}</div>
      <div class="delivery-item-meta">
        {% if item.ref %}<span>REF: {{ item.ref }}</span>{% endif %}
        {% if item.SMN_code %}<span>SMN: {{ item.SMN_code }}</span>{% endif %}
        {% if item.category %}<span>{{ item.category }}</span>{% endif %}
      </div>
    </div>
    <div class="col-md-2">
      <label class="form-label small mb-0 text-muted">LOT</label>
      <input name="lot_input_field_{{ item.id }}" value="{% if del_sup %}{{ del_sup.supplyLot }}{% endif %}" type="text" class="form-control form-control-sm">
    </div>
    <div class="col-md-2">
      <label class="form-label small mb-0 text-muted">Термін</label>
      <input name="expired_input_field_{{ item.id }}" value="{% if del_sup %}{{ del_sup.expiredDate_desc }}{% endif %}" type="text"
        class="form-control form-control-sm" placeholder="РРРР-ММ-ДД" maxlength="10" data-delivery-date-mask>
    </div>
    <div class="col-md-2">
      <label class="form-label small mb-0 text-muted">К-ть</label>
      <input name="count_input_field_{{ item.id }}" value="{% if del_sup %}{{ del_sup.count }}{% endif %}" type="number" min="0" class="form-control form-control-sm">
    </div>
    <div class="col-md-2 text-end">
      {% if del_sup %}
      <button type="button" class="btn btn-sm btn-outline-danger"
        hx-post="{% url 'add_gen_sup_in_delivery_order_manual_list_delete_action' %}"
        hx-vals='{"del_sup_id": "{{ del_sup.id }}"}'
        hx-target="closest .delivery-staging-row"
        hx-swap="delete">
        <i class="bi bi-trash3"></i>
      </button>
      {% else %}
      <button type="button" class="btn btn-sm btn-outline-secondary"
        hx-on::click="this.closest('.delivery-staging-row')?.remove()">
        <i class="bi bi-x-lg"></i>
      </button>
      {% endif %}
      <button type="button" class="btn btn-sm btn-primary"
        hx-post="{% url 'add_gen_sup_in_delivery_order_manual_list_save_action' %}"
        hx-vals='{"gen_sup_id": {{ item.id }}, "del_sup_id": "{% if del_sup %}{{ del_sup.id }}{% endif %}", "delivery_order_id": {{ delivery_order_id }}, "save_mode": "staging"}'
        hx-include="closest .delivery-staging-row"
        hx-target="closest .delivery-staging-row"
        hx-swap="delete">
        <i class="bi bi-check-lg"></i>
      </button>
    </div>
  </div>
</div>
